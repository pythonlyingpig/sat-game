<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://wild-mountain-bab7.pythonlyingpig.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>開關機台挑戰</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 開始畫面 -->
<section id="screen-start" class="screen">
  <div class="start-box">
    <h1>開關機台挑戰</h1>
    <p class="lead">把開關撥好，讓所有規則同時過關。<br>每條規則有三個條件，只要對一個就算過關。</p>

    <label class="field-label" for="name">你的名字（會顯示在排行榜）</label>
    <input id="name" type="text" maxlength="20" autocomplete="nickname" placeholder="最多 20 個字">

    <div class="field-label">選擇難度</div>
    <div class="levels" id="levels">
      <label class="level-card"><input type="radio" name="level" value="low"><span class="level-name">低</span></label>
      <label class="level-card"><input type="radio" name="level" value="mid"><span class="level-name">中</span></label>
      <label class="level-card"><input type="radio" name="level" value="high"><span class="level-name">高</span></label>
    </div>

    <div class="error" id="start-error"></div>
    <button id="btn-start" class="btn-primary">確認，開始</button>
    <p class="note">每一題只能送出一次答案，送出後這一局就結束。</p>
  </div>
</section>

<!-- 遊戲畫面 -->
<section id="screen-game" class="screen" hidden>
  <header class="status">
    <div class="status-title">
      <span class="badge" id="g-level"></span>
      <span id="g-size"></span>
    </div>
    <div class="status-progress">
      <span>過關 <b id="g-passed">0</b> / <span id="g-total">0</span></span>
      <div class="bar"><div class="bar-fill" id="g-bar"></div></div>
    </div>
    <div class="status-timer">⏱ <span id="g-timer">00:00</span></div>
  </header>

  <main class="board">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">開關</span>
        <span class="hint" id="sw-hover">點一下切換開／關</span>
        <span class="spacer"></span>
        <input id="sw-jump" type="number" min="1" placeholder="跳到第幾號">
      </div>
      <div class="switches-scroll" id="sw-scroll"><div id="switches" class="switches"></div><div id="sw-spacer" class="sw-spacer"><canvas id="sw-canvas"></canvas></div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">規則</span>
        <div class="tabs" id="rule-filter">
          <button data-f="all" class="on">全部</button>
          <button data-f="fail">只看沒過</button>
          <button data-f="sel" id="filter-sel" disabled>選中的開關</button>
        </div>
        <span class="spacer"></span>
        <input id="rule-jump" type="number" min="1" placeholder="跳到規則#">
      </div>
      <div class="rules-info" id="rules-info"></div>
      <div class="rules-scroll" id="rules-scroll"><div id="rules-spacer"></div></div>
    </div>
  </main>

  <footer class="actions">
    <button id="btn-export">📋 匯出題目給 AI</button>
    <button id="btn-clear">全部關掉</button>
    <div class="answer">
      <textarea id="answer" rows="2" spellcheck="false" placeholder="貼上答案：一串 0 和 1（1 = 開、0 = 關），長度剛好等於開關數"></textarea>
      <div class="answer-side">
        <span id="answer-count"></span>
        <button id="btn-apply">套用到開關</button>
      </div>
    </div>
    <button id="btn-submit" class="btn-primary">送出答案</button>
  </footer>
  <div class="error game-error" id="game-error"></div>
</section>

<!-- 結果與排行榜 -->
<section id="screen-result" class="screen" hidden>
  <div class="result-box">
    <h2 id="r-title"></h2>
    <p id="r-detail" class="r-detail"></p>
    <div class="board-head">
      <h3>排行榜</h3>
      <div class="tabs" id="board-tabs">
        <button data-l="low">低</button>
        <button data-l="mid">中</button>
        <button data-l="high">高</button>
      </div>
    </div>
    <table class="leaderboard">
      <thead><tr><th>名次</th><th>名字</th><th>用時</th><th>完成時間</th></tr></thead>
      <tbody id="board-body"></tbody>
    </table>
    <button id="btn-again" class="btn-primary">再玩一次</button>
  </div>
</section>

<!-- 匯出題目 -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3>匯出題目給 AI</h3>
      <button id="modal-close" class="btn-x" aria-label="關閉">✕</button>
    </div>
    <textarea id="prompt" readonly spellcheck="false"></textarea>
    <div class="modal-actions">
      <span id="copy-msg" class="hint"></span>
      <button id="btn-download">下載 .txt</button>
      <button id="btn-copy" class="btn-primary">複製</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
